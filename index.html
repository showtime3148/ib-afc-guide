<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB AFC 길잡이</title>
<meta name="description" content="IB DP 후보학교 신청서(AFC)를 처음 작성하는 선생님을 위한 단계별 체크리스트, 항목별 가이드, 문제 해결, AI 영문 답안 도우미">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <p class="eyebrow">IB DP 후보학교 신청서(AFC)</p>
      <h1>AFC 길잡이</h1>
      <p class="sub">처음 신청하는 학교가 막히지 않도록, 먼저 해 본 학교의 경험을 정리했습니다.</p>
    </div>
    <div class="progress-box" aria-live="polite">
      <div class="ring"><span id="pct">0%</span></div>
      <p id="pct-text">0 / 0 완료</p>
    </div>
  </div>
  <nav class="tabs wrap" role="tablist">
    <button role="tab" data-tab="steps" aria-selected="true">단계별 체크리스트</button>
    <button role="tab" data-tab="screens" aria-selected="false">실제 화면 보기</button>
    <button role="tab" data-tab="guide" aria-selected="false">항목별 가이드</button>
    <button role="tab" data-tab="trouble" aria-selected="false">문제 해결</button>
    <button role="tab" data-tab="ai" aria-selected="false">AI 영문 도우미</button>
  </nav>
</header>

<main class="wrap">
  <section id="tab-steps" class="panel"></section>
  <section id="tab-screens" class="panel" hidden></section>
  <section id="tab-guide" class="panel" hidden></section>
  <section id="tab-trouble" class="panel" hidden></section>
  <section id="tab-ai" class="panel" hidden></section>
</main>

<footer class="wrap foot">
  <div class="maker">
    <p class="maker-title">만든 사람</p>
    <p><b>예당고등학교 교감 이동민</b></p>
    <p>문의 사항은 <a href="tel:010-9696-3884">010-9696-3884</a>로 연락 주세요.</p>
  </div>
  <p>예시 답변은 예당고등학교(전남 보성)가 2026년 DP 후보학교를 신청하며 작성한 초안입니다. 학교 상황에 맞게 반드시 고쳐 쓰세요. IB 양식과 절차는 바뀔 수 있으니 최신 안내는 IB 공식 자료로 확인하세요.</p>
  <p>진행 상황은 이 브라우저에만 저장됩니다.</p>
</footer>
<script src="guide.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
